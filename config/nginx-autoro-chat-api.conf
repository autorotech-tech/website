# Proxy site chat widget -> chat-gateway (same pattern as pquoc.com)
location /api/chat-webhook {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        return 204;
    }
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $chat_host chat.autoro.tech;
    rewrite ^ /v1/chat-agent/message break;
    proxy_pass https://$chat_host;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host chat.autoro.tech;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
}

location /api/chat-poll {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        return 204;
    }
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $chat_host chat.autoro.tech;
    rewrite ^ /v1/chat-agent/poll$is_args$args break;
    proxy_pass https://$chat_host;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host chat.autoro.tech;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
