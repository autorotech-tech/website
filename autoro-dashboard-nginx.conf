server {
    listen 80;
    
    # Скрытие версии nginx
    server_tokens off;
    
    # Блокировка доступа к source maps и служебным файлам
    location ~* \.(map)$ {
        deny all;
        return 404;
    }
    
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Защитные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Content Security Policy - разрешаем необходимые источники для работы Supabase и React
        # Внимание: 'unsafe-inline' и 'unsafe-eval' необходимы для работы React и некоторых библиотек
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http://46.250.228.229:54321 wss: ws:; frame-src 'self' https: https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }

    # Admin API in blog runs under /api/admin/* in Next.js.
    # In swoop we expose it as /api/blog/admin/* so the dashboard can call it consistently.
    location ^~ /api/blog/admin/ {
        proxy_pass http://autoro-blog-nextjs:3000/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy Blog API internally
    location /api/blog/ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Blog pages to Next.js (AstroPaper layout)
    location /_next/ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /blog {
        return 302 /en/blog;
    }
    location ~ ^/(en|ru)/blog/?$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~ ^/(en|ru)/blog/(.+)$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/blog/(.+)$ {
        return 302 /en/blog/$1;
    }

    # Proxy Supabase Auth/Rest requests directly to container
    location /supabase/ {
        proxy_pass http://supabase-kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

