<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Job Responder</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Job Responder</h1>
      <p class="hint" id="authHint">Загрузка…</p>
    </header>

    <section class="card">
      <h2>Sources (Resume RAG)</h2>
      <p class="hint" id="resumeStatus">—</p>
      <div class="row">
        <button type="button" id="refreshSourcesBtn" class="secondary">Обновить sources</button>
      </div>
      <div class="sourcesList" id="sourcesList"></div>

      <div class="field">
        <span>CV файл (primary)</span>
        <input id="resumeFile" type="file" accept=".pdf,.txt,.md,.doc,.docx,.html,.csv,.json" />
        <button type="button" id="uploadResumeFileBtn" class="secondary">Добавить CV</button>
      </div>

      <div class="field">
        <span>Portfolio файлы (references)</span>
        <input id="portfolioFiles" type="file" multiple accept=".pdf,.txt,.md,.doc,.docx,.html,.csv,.json" />
        <button type="button" id="uploadPortfolioFilesBtn" class="secondary">Добавить portfolio</button>
      </div>

      <div class="field">
        <span>Ссылка (URL)</span>
        <input id="linkUrl" type="url" placeholder="https://..." />
        <input id="linkTitle" type="text" placeholder="Название (необязательно)" />
        <button type="button" id="addLinkBtn" class="secondary">Добавить ссылку</button>
      </div>
    </section>

    <section class="card">
      <h2>Вакансия</h2>
      <p class="hint" id="vacancyMeta">Откройте любую страницу вакансии и нажмите «Обновить с страницы»</p>
      <div class="row">
        <button type="button" id="refreshVacancyBtn" class="secondary">Обновить с страницы</button>
      </div>
      <label class="field">
        <span>Описание (можно править вручную)</span>
        <textarea id="vacancyDescription" rows="5" placeholder="Если парсер не сработал - вставьте текст вручную"></textarea>
      </label>
    </section>

    <section class="card">
      <h2>Генерация</h2>
      <div class="row">
        <button type="button" id="genCoverBtn">Отклик</button>
        <button type="button" id="genAnswersBtn" class="secondary">Ответы на вопросы</button>
      </div>
      <label class="field">
        <span>Результат (можно править)</span>
        <textarea id="resultText" rows="12"></textarea>
      </label>
      <div class="row">
        <button type="button" id="copyBtn" class="secondary">Копировать</button>
      </div>
      <p class="hint" id="genMeta"></p>
    </section>

    <footer class="footer">
      <button type="button" id="loginBtn" class="link" hidden>Вход</button>
      <button type="button" id="logoutBtn" class="link" hidden>Выход</button>
    </footer>

    <p class="error" id="error"></p>
    <p class="success" id="success"></p>

    <script src="lib/api.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
