<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Job Responder - Login</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; max-width: 360px; margin: 0 auto; }
      input, button { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 10px; }
      button { background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
      .error { color: #b91c1c; font-size: 12px; }
      .success { color: #15803d; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Job Responder</h1>
    <p>Keept auth (email/password)</p>
    <input id="emailInput" type="email" placeholder="email" />
    <input id="passwordInput" type="password" placeholder="password" />
    <button id="loginSubmitBtn" type="button">Login</button>
    <button id="signupBtn" type="button">Sign up</button>
    <p class="error" id="error"></p>
    <p class="success" id="success"></p>
    <script src="login.js"></script>
  </body>
</html>
