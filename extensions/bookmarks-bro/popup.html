<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Keep It For Me</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
      }
      * { box-sizing: inherit; }
      html, body {
        width: 360px;
        min-width: 360px;
        max-width: none;
        max-height: 580px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .popup-shell {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 12px 12px 8px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; }
      button {
        width: 100%;
        min-height: 40px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      button.sync-primary {
        font-weight: 700;
        font-size: 14px;
        min-height: 44px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
      }
      #status { margin-top: 10px; font-size: 12px; color: #374151; white-space: pre-wrap; }
      .hint {
        margin: 0 0 10px;
        font-size: 11px;
        color: #64748b;
        line-height: 1.35;
      }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .row button { width: 100%; }
      .muted { margin-top: 8px; font-size: 11px; color: #6b7280; line-height: 1.4; }
      .search-wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 8px 0; }
      .search-wrap input { border: 1px solid #d1d5db; border-radius: 8px; padding: 10px; font-size: 12px; }
      .search-wrap button { width: auto; padding: 10px 12px; }
      .link-btn { background: #0f172a; }
      .outline-btn {
        background: #fff !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
      }
      .btn-spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        vertical-align: -1px;
        animation: keeptSpin 0.7s linear infinite;
      }
      @keyframes keeptSpin {
        to { transform: rotate(360deg); }
      }
      .work-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 8px 12px;
        background: #eef2ff;
        border-top: 1px solid #c7d2fe;
        color: #3730a3;
        font-size: 12px;
        line-height: 1.35;
      }
      .work-bar .btn-spinner { display: none; }
      .work-bar.is-busy .btn-spinner { display: inline-block; }
      .work-bar.is-ok {
        background: #f0fdf4;
        border-top-color: #bbf7d0;
        color: #166534;
      }
      .work-bar.is-error {
        background: #fef2f2;
        border-top-color: #fecaca;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="popup-shell" id="popupShell">
      <h1>Keep It For Me</h1>
      <p class="hint" id="buildHint"></p>
      <p class="hint" id="authHint">Загрузка…</p>
      <button type="button" id="syncBtn" class="sync-primary">Sync → Vector + Obsidian</button>
      <p class="hint">Закладки → enrich → embedding → Unified KB → заметка в Obsidian vault.</p>
      <div class="search-wrap">
        <input id="aiTaskInput" type="text" placeholder="AI-поиск: что найти?" />
        <button type="button" id="aiSearchBtn">AI Search</button>
      </div>
      <div class="row">
        <select id="searchModeSelect" style="width:100%; min-height:40px; border:1px solid #d1d5db; border-radius:8px; padding:8px; font-size:12px; color:#0f172a; background:#fff;">
          <option value="bookmarks">Поиск по закладкам</option>
          <option value="web_research">Web Research</option>
        </select>
      </div>
      <div class="row">
        <button type="button" id="appBtn" class="outline-btn">Knowledge App</button>
        <button type="button" id="libraryBtn" class="outline-btn">Library</button>
      </div>
      <div class="row">
        <button type="button" id="settingsBtn" class="link-btn">Настройки</button>
      </div>
      <div class="row">
        <button type="button" id="statusBtn">Статус job</button>
      </div>
      <div class="muted">
        Последний job: <span id="lastJob">—</span><br/>
        Последняя синхронизация: <span id="lastSync">—</span>
      </div>
      <div id="status"></div>
    </div>
    <div id="workBar" class="work-bar" role="status" aria-live="polite" aria-busy="false">
      <span class="btn-spinner" aria-hidden="true"></span>
      <span id="workBarText">Готово к работе</span>
    </div>
    <script src="extension-config.js"></script>
    <script src="extension-api.js"></script>
    <script src="oauth-helpers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
