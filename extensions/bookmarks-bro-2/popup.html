<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarks Bro</title>
    <style>
      body { font-family: Arial, sans-serif; width: 320px; margin: 0; padding: 12px; }
      h1 { font-size: 16px; margin: 0 0 10px; }
      .field { margin-bottom: 8px; }
      .field label { display: block; margin-bottom: 4px; font-size: 11px; color: #374151; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 12px; }
      button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      #status { margin-top: 10px; font-size: 12px; color: #374151; white-space: pre-wrap; }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .row button { width: 100%; }
      .muted { margin-top: 8px; font-size: 11px; color: #6b7280; line-height: 1.4; }
      .check { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #111827; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Bookmarks Bro</h1>
    <div class="field">
      <label for="apiBase">API Base</label>
      <input id="apiBase" type="text" placeholder="https://swoop.autoro.tech" />
    </div>
    <div class="field">
      <label for="apiKey">X-API-Key</label>
      <input id="apiKey" type="password" placeholder="Enter API key (stored locally)" />
    </div>
    <div class="field">
      <label for="workspaceId">Workspace ID</label>
      <input id="workspaceId" type="text" placeholder="1" />
    </div>
    <div class="field">
      <label for="profileId">Profile ID</label>
      <input id="profileId" type="text" placeholder="chrome-xxxx" />
    </div>
    <label class="check">
      <input type="checkbox" id="autoSync" />
      Enable auto-sync every 30 minutes
    </label>
    <div class="row">
      <button id="saveBtn">Save Settings</button>
    </div>
    <div class="row">
      <button id="statusBtn">Check Job Status</button>
    </div>
    <div class="row">
      <button id="syncBtn">Sync Bookmarks Now</button>
    </div>
    <div class="muted">
      Last Job: <span id="lastJob">—</span><br/>
      Last Sync: <span id="lastSync">—</span>
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
  </html>
