# Nginx stream: порт 443 — маршрутизация по SNI
# Наши домены -> nginx-proxy:8443, остальное -> Outline:10443
stream {
    map $ssl_preread_server_name $backend {
        ~^(api\.|chat\.|swoop\.|tech\.|www\.)?autoro\.tech$  127.0.0.1:8443;
        ~^(www\.)?pquoc\.com$                                127.0.0.1:8443;
        default                                              127.0.0.1:10443;
    }
    server {
        listen 443;
        proxy_pass $backend;
        proxy_protocol off;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }
}
