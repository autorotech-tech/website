server {
    listen 80;
    server_name autoro.tech www.autoro.tech cdn.autoro.tech;

    # Serve _next static assets directly without fallback
    location /_next/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blog: exact /blog (listing)
    location = /blog {
        add_header X-Frame-Options "SAMEORIGIN" always;
        root /usr/share/nginx/html;
        try_files /blog.html =404;
    }

    # Blog: locale prefix listing (e.g. /en/blog, /ru/blog)
    location ~ ^/(en|ru|es|it|vi)/blog$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        root /usr/share/nginx/html;
        try_files /blog.html =404;
    }

    # Blog: single post /blog/slug
    location ~ ^/blog/([^/]+)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        root /usr/share/nginx/html;
        try_files /blog-post.html =404;
    }

    # Blog: single post with locale /en/blog/slug
    location ~ ^/(en|ru|es|it|vi)/blog/([^/]+)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        root /usr/share/nginx/html;
        try_files /blog-post.html =404;
    }

    # Serve static main site
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
