version: '3.8'
services:
  blog:
    build:
      context: ..
      dockerfile: blog-autoro/Dockerfile
    container_name: autoro-blog-nextjs
    restart: always
    ports:
      - '3002:3002'
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - BLOG_NEWS_ROOT=/app
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://autoro.tech}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-https://swoop.autoro.tech}
      - SWOOP_API_BASE=${SWOOP_API_BASE:-https://swoop.autoro.tech}
      - SWOOP_API_KEY=${SWOOP_API_KEY}
      - BLOG_NEWS_REQUIRE_APPROVAL=1
      - BLOG_ADMIN_EMAILS=${BLOG_ADMIN_EMAILS:-autoro.tech@gmail.com}
    volumes:
      - ../content/blog-news:/app/content/blog-news
      - ../data:/app/data
      - ../config:/app/config
    networks:
      - proxy
      - default

networks:
  proxy:
    external: true
