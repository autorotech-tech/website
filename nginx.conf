server {
    listen 80;
    
    # Скрытие версии nginx
    server_tokens off;
    
    # Блокировка доступа к source maps и служебным файлам
    location ~* \.(map)$ {
        deny all;
        return 404;
    }
    
    location ~ /\. {
        deny all;
        return 404;
    }

    # Tracking redirect engine (/go/:spot_id) for Telegram deep links
    # Use Docker embedded DNS + variable upstream so IP changes after container
    # recreate do not stick as stale nginx resolve-at-start addresses (502).
    location ^~ /go/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_api_upstream autoro-agent-api:8900;
        proxy_pass http://$agent_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing redirect resolver (/l/:slug) -> landing page with go_link
    location ^~ /l/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_api_upstream autoro-agent-api:8900;
        proxy_pass http://$agent_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal n8n integration API (Basic Auth validated in service)
    location ^~ /api/internal/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_api_upstream autoro-agent-api:8900;
        proxy_pass http://$agent_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swoop agent-api: scrape, bookmarks, health (must be before static location /)
    location ^~ /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_api_upstream autoro-agent-api:8900;
        proxy_pass http://$agent_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Site chat -> chat-gateway (Telegram relay + operator replies)
    location /api/chat-webhook {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            return 204;
        }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chat_upstream autoro-chat-gateway;
        rewrite ^ /v1/chat-agent/message break;
        proxy_pass http://$chat_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host chat.autoro.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /api/chat-poll {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            return 204;
        }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chat_upstream autoro-chat-gateway;
        rewrite ^ /v1/chat-agent/poll$is_args$args break;
        proxy_pass http://$chat_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host chat.autoro.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    
    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Защитные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Content Security Policy - разрешаем необходимые источники для работы Supabase и React
        # Внимание: 'unsafe-inline' и 'unsafe-eval' необходимы для работы React и некоторых библиотек
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http://46.250.228.229:54321 wss: ws:; frame-src 'self' https: https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }

    # Проксирование запросов к Supabase (для безопасности и CORS)
    # Это позволит обращаться к API как /supabase/v1/...
    # Proxy Blog API internally
    # Admin endpoints in Next.js are under /api/admin/*, while swoop calls them via /api/blog/admin/*
    # This keeps the public contract (/api/blog/posts) intact and maps admin calls correctly.
    location ^~ /api/blog/admin/ {
        proxy_pass http://autoro-blog-nextjs:3000/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/blog/ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Blog pages to Next.js (AstroPaper layout)
    location /_next/ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /blog {
        return 302 /en/blog;
    }
    location ~ ^/(en|ru)/blog/?$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~ ^/(en|ru)/blog/(.+)$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/blog/(.+)$ {
        return 302 /en/blog/$1;
    }

    # Supabase gateway routing via api.autoro.tech (avoids local DNS coupling)
    location /supabase/ {
        proxy_pass https://api.autoro.tech/;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host api.autoro.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Deep Search worker (SSE streaming support)
    location /api/deep-search/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support — disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Required for SSE
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }
}
