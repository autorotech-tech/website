# SafeDep vet + Cloud (malware-aware policy). Секреты: SAFEDEP_CLOUD_API_KEY, SAFEDEP_CLOUD_TENANT_DOMAIN
# https://docs.safedep.io/cloud/quickstart
name: SafeDep vet

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/vet/**'
      - '.github/workflows/safedep-vet.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/vet/**'
      - '.github/workflows/safedep-vet.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:
  vet:
    name: vet (SafeDep Cloud)
    runs-on: ubuntu-latest
    # Не использовать cloud-ключи на PR из форков
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run vet
        id: vet
        uses: safedep/vet-action@v1
        with:
          policy: .github/vet/policy.yml
          cloud: true
          cloud-key: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
          cloud-tenant: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
