version: '3'
services:
  autoro-blog-nextjs:
    build: ./website
    restart: always
    container_name: autoro-blog-nextjs
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=https://swoop.autoro.tech/api/auth
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - BLOG_API_URL=https://autoro.tech/api/blog
      - POSTGRES_URL=${POSTGRES_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - default
      - proxy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "swoop.autoro.tech:46.250.228.229"
      - "api.autoro.tech:46.250.228.229"
      - "autoro.tech:46.250.228.229"
      - "autoro.tech:46.250.228.229"

  website:
    image: nginx:alpine
    container_name: autoro-website
    restart: always
    environment:
      - VIRTUAL_HOST=autoro.tech,www.autoro.tech,cdn.autoro.tech
      - LETSENCRYPT_HOST=autoro.tech,www.autoro.tech,cdn.autoro.tech
      - LETSENCRYPT_EMAIL=autoro.tech@gmail.com
      - HTTPS_METHOD=noredirect
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/vladx/projects/autoro.tech/html:/usr/share/nginx/html:ro
    networks:
      - proxy
      - default
    ports:
      - "80"
networks:
  proxy:
    external: true
