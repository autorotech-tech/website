server {
    listen 80;
    server_name autoro.tech www.autoro.tech cdn.autoro.tech;

    # Serve static main site
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the blog container
    location /api/blog/ {
        # Global CORS headers for all responses (GET, POST, etc.)
        add_header 'Access-Control-Allow-Origin' 'https://swoop.autoro.tech' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            # Return 204 explicitly
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy to REST service
        # We assume rest:3000/api/blog/ preserves the path
        proxy_pass http://rest:3000/api/blog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Blog to Next.js (AstroPaper layout)
    location /_next/ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /blog {
        return 302 /en/blog;
    }
    location ~ ^/(en|ru)/blog/?$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(en|ru)/blog/(.+)$ {
        proxy_pass http://autoro-blog-nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/blog/(.+)$ {
        return 302 /en/blog/$1;
    }
    
    # Also proxy /blog/ for trailing slash handling if needed, or let Next.js handle it

    # Proxy Supabase Auth/Rest requests directly to container
    location /supabase/ {
        proxy_pass http://supabase-kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
